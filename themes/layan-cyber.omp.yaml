# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

palette:
    cyan: '#8be9fd'
    dark: '#282a36'
    green: '#50fa7b'
    grey: '#44475a'
    light: '#f8f8f2'
    orange: '#ffb86c'
    pink: '#ff79c6'
    purple: '#bd93f9'
    red: '#ff5555'
    yellow: '#f1fa8c'
transient_prompt:
    template: '{{ if gt .Code 0 }} ✗ {{ .Code }}{{ end }} ❯ '
    background: transparent
    foreground_templates:
        - '{{ if gt .Code 0 }}p:red{{ end }}'
        - p:green
upgrade:
    source: cdn
    interval: 168h
    auto: false
    notice: false
blocks:
    - type: prompt
      alignment: left
      segments:
        - leading_diamond: 
          trailing_diamond: ' '
          template: " {{ if .Icon }}{{ .Icon }}{{ else }}\U0001F427{{ end }} "
          foreground: p:dark
          background: p:purple
          type: os
          style: diamond
          min_width: 50
        - leading_diamond: 
          trailing_diamond: ' '
          template: " {{ if .Root }}⚡ {{ end }}{{ if .SSHSession }}\U000F08B9 {{ end }}{{ if .UserName }}{{ .UserName }}{{ else }}user{{ end }}@{{ .HostName }} "
          foreground: p:dark
          type: session
          style: diamond
          background_templates:
            - '{{ if .Root }}p:red{{ end }}'
            - p:cyan
          min_width: 65
        - options:
            style: folder
          leading_diamond: 
          trailing_diamond: ' '
          template: " \U0001F4C1 {{ .Path }}{{ if not .Writable }} {{ end }} "
          foreground: p:dark
          background: p:green
          type: path
          style: diamond
        - options:
            branch_ahead_icon: ↑
            branch_behind_icon: ↓
            branch_gone_icon: ≢
            branch_identical_icon: ≡
            commit_icon: ' '
            rebase_icon: ' '
          cache:
            duration: 5m
            strategy: folder
          leading_diamond: 
          trailing_diamond: ' '
          template: ' {{ if .HEAD }}{{ trunc 20 .HEAD }}{{ end }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
          foreground: p:dark
          background: p:yellow
          type: git
          style: diamond
          background_templates:
            - '{{ if gt .Working.Unmerged 0 }}p:red{{ end }}'
            - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}'
            - '{{ if or (.Working.Changed) (.Staging.Changed) }}p:orange{{ end }}'
            - '{{ if gt .Behind 0 }}p:orange{{ end }}'
            - '{{ if gt .Ahead 0 }}p:purple{{ end }}'
      newline: true
    - type: rprompt
      overflow: hide
      segments:
        - options:
            display_mode: files
            fetch_package_manager: false
            home_enabled: false
          cache:
            duration: 10m
            strategy: folder
          leading_diamond: 
          trailing_diamond: ' '
          template: '  {{ .Full }} '
          foreground: p:green
          background: p:grey
          type: node
          style: diamond
        - options:
            display_mode: files
            fetch_version: true
            home_enabled: false
            parse_mod_file: true
          cache:
            duration: 10m
            strategy: folder
          leading_diamond: 
          trailing_diamond: ' '
          template: '{{ if .Full }}  {{ .Full }} {{ end }}'
          foreground: p:cyan
          background: p:grey
          type: go
          style: diamond
        - options:
            display_mode: files
            fetch_version: false
            home_enabled: false
          cache:
            duration: 10m
            strategy: folder
          leading_diamond: 
          trailing_diamond: ' '
          template: '{{ if .Full }}  {{ .Full }} {{ end }}'
          foreground: p:orange
          background: p:grey
          type: rust
          style: diamond
        - options:
            display_mode: environment
            fetch_version: false
            home_enabled: false
          cache:
            duration: 10m
            strategy: folder
          leading_diamond: 
          trailing_diamond: ' '
          template: '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Venv }}{{ end }} '
          foreground: p:yellow
          background: p:grey
          type: python
          style: diamond
        - options:
            style: austin
            threshold: 2000
          leading_diamond: 
          trailing_diamond: ' '
          template: " \U000F13AB {{ .FormattedMs }} "
          foreground: p:dark
          background: p:yellow
          type: executiontime
          style: diamond
    - type: prompt
      alignment: left
      segments:
        - template: '{{ if gt .Code 0 }} ✗ {{ .Code }}{{ end }}'
          foreground: p:red
          type: status
          style: plain
        - template: ' ❯'
          background: transparent
          type: text
          style: plain
          foreground_templates:
            - '{{ if gt .Code 0 }}p:red{{ end }}'
            - p:green
      newline: true
version: 3
final_space: true
