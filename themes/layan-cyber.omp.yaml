# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

palette:
    cyan: '#8be9fd'
    dark: '#282a36'
    green: '#50fa7b'
    grey: '#44475a'
    light: '#f8f8f2'
    orange: '#ffb86c'
    pink: '#ff79c6'
    purple: '#bd93f9'
    red: '#ff5555'
    yellow: '#f1fa8c'
transient_prompt:
    template: ' ❯ '
    background: transparent
    foreground_templates:
        - '{{ if gt .Code 0 }}p:red{{ end }}'
        - p:green
upgrade:
    source: cdn
    interval: 168h
    auto: false
    notice: false
blocks:
    - type: prompt
      alignment: left
      segments:
        - leading_diamond: 
          trailing_diamond: ' '
          template: " {{ if .Icon }}{{ .Icon }}{{ else }}\U0001F427{{ end }} "
          foreground: p:dark
          background: p:purple
          type: os
          style: diamond
        - leading_diamond: 
          trailing_diamond: ' '
          template: ' {{ if .Root }}⚡ {{ end }}{{ .UserName }}@{{ .HostName }} '
          foreground: p:dark
          type: session
          style: diamond
          background_templates:
            - '{{ if .Root }}p:red{{ end }}'
            - p:cyan
        - options:
            max_depth: 3
            style: folder
          leading_diamond: 
          trailing_diamond: ' '
          template: " \U0001F4C1 {{ .Path }} "
          foreground: p:dark
          background: p:green
          type: path
          style: diamond
        - options:
            cache_duration: 5m
            fetch_stash: false
            fetch_status: true
            fetch_upstream: false
            fetch_worktree: false
            ignore_submodules:
                - all
            timeout: 500
          leading_diamond: 
          trailing_diamond: ' '
          template: '  {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} '
          foreground: p:dark
          background: p:yellow
          type: git
          style: diamond
          background_templates:
            - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}'
            - '{{ if gt .Ahead 0 }}p:purple{{ end }}'
            - '{{ if gt .Behind 0 }}p:orange{{ end }}'
            - '{{ if or (.Working.Changed) (.Staging.Changed) }}p:orange{{ end }}'
      newline: true
    - type: prompt
      alignment: right
      segments:
        - options:
            cache_duration: 10m
            display_mode: files
            fetch_package_manager: false
            home_enabled: false
          leading_diamond: 
          trailing_diamond: ' '
          template: '  {{ .Full }} '
          foreground: p:green
          background: p:grey
          type: node
          style: diamond
        - options:
            cache_duration: 10m
            display_mode: environment
            fetch_version: true
            home_enabled: false
          leading_diamond: 
          trailing_diamond: ' '
          template: '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Venv }}{{ end }} '
          foreground: p:yellow
          background: p:grey
          type: python
          style: diamond
        - options:
            style: human
            threshold: 2000
          leading_diamond: 
          trailing_diamond: ' '
          template: " \U000F13AB {{ .FormattedMs }} "
          foreground: p:dark
          background: p:yellow
          type: executiontime
          style: diamond
    - type: prompt
      alignment: left
      segments:
        - template: '{{ if gt .Code 0 }} ✗ {{ .Code }}{{ end }}'
          foreground: p:red
          type: exit
          style: plain
        - template: ' ❯ '
          background: transparent
          type: text
          style: plain
          foreground_templates:
            - '{{ if gt .Code 0 }}p:red{{ end }}'
            - p:green
      newline: true
version: 3
final_space: true
