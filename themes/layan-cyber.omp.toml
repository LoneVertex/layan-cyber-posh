"" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 3
final_space = true

[palette]
  dark   = "#282a36"
  light  = "#f8f8f2"
  red    = "#ff5555"
  orange = "#ffb86c"
  yellow = "#f1fa8c"
  green  = "#50fa7b"
  cyan   = "#8be9fd"
  purple = "#bd93f9"
  pink   = "#ff79c6"
  grey   = "#44475a"

[transient_prompt]
  background = "transparent"
  foreground_templates = [
    "{{ if gt .Code 0 }}p:red{{ end }}",
    "p:green"
  ]
  template = " ❯ "

[[blocks]]
  type      = "prompt"
  alignment = "left"
  newline   = true

  [[blocks.segments]]
    type             = "os"
    style            = "diamond"
    leading_diamond  = ""
    trailing_diamond = " "
    background       = "p:purple"
    foreground       = "p:dark"
    template         = " {{ if .Icon }}{{ .Icon }}{{ else }}🐧{{ end }} "

  [[blocks.segments]]
    type             = "session"
    style            = "diamond"
    leading_diamond  = ""
    trailing_diamond = " "
    background_templates = [
      "{{ if .Root }}p:red{{ end }}",
      "p:cyan"
    ]
    foreground = "p:dark"
    template   = " {{ if .Root }}⚡ {{ end }}{{ if .SSHSession }}󰢹 {{ end }}{{ .UserName }}@{{ .HostName }} "

  [[blocks.segments]]
    type             = "path"
    style            = "diamond"
    leading_diamond  = ""
    trailing_diamond = " "
    background = "p:green"
    foreground = "p:dark"
    template   = " 📁 {{ .Path }} "
    [blocks.segments.properties]
      style     = "folder"
      max_depth = 3

  [[blocks.segments]]
    type             = "git"
    style            = "diamond"
    leading_diamond  = ""
    trailing_diamond = " "
    background = "p:yellow"
    background_templates = [
      "{{ if gt .Working.Unmerged 0 }}p:red{{ end }}",
      "{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}",
      "{{ if or (.Working.Changed) (.Staging.Changed) }}p:orange{{ end }}",
      "{{ if gt .Behind 0 }}p:orange{{ end }}",
      "{{ if gt .Ahead 0 }}p:purple{{ end }}"
    ]
    foreground = "p:dark"
    template   = " {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
    [blocks.segments.properties]
      fetch_status   = true
      fetch_upstream = false
      cache_duration = "5m"
      timeout        = 500

[[blocks]]
  type      = "prompt"
  alignment = "right"
  overflow  = "hide"

  [[blocks.segments]]
    type             = "node"
    style            = "diamond"
    leading_diamond  = ""
    trailing_diamond = " "
    background = "p:grey"
    foreground = "p:green"
    template   = "  {{ .Full }} "
    [blocks.segments.properties]
      display_mode          = "files"
      home_enabled          = false
      fetch_package_manager = false
      cache_duration        = "10m"

  [[blocks.segments]]
    type             = "go"
    style            = "diamond"
    leading_diamond  = ""
    trailing_diamond = " "
    background = "p:grey"
    foreground = "p:cyan"
    template   = "  {{ .Full }} "
    [blocks.segments.properties]
      display_mode   = "files"
      home_enabled   = false
      fetch_version  = false
      cache_duration = "10m"

  [[blocks.segments]]
    type             = "rust"
    style            = "diamond"
    leading_diamond  = ""
    trailing_diamond = " "
    background = "p:grey"
    foreground = "p:orange"
    template   = "  {{ .Full }} "
    [blocks.segments.properties]
      display_mode   = "files"
      home_enabled   = false
      fetch_version  = false
      cache_duration = "10m"

  [[blocks.segments]]
    type             = "python"
    style            = "diamond"
    leading_diamond  = ""
    trailing_diamond = " "
    background = "p:grey"
    foreground = "p:yellow"
    template   = "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Venv }}{{ end }} "
    [blocks.segments.properties]
      display_mode   = "environment"
      home_enabled   = false
      fetch_version  = false
      cache_duration = "10m"

  [[blocks.segments]]
    type             = "executiontime"
    style            = "diamond"
    leading_diamond  = ""
    trailing_diamond = " "
    background = "p:yellow"
    foreground = "p:dark"
    template   = " 󱎫 {{ .FormattedMs }} "
    [blocks.segments.properties]
      threshold = 2000
      style     = "austin"

[[blocks]]
  type      = "prompt"
  alignment = "left"
  newline   = true

  [[blocks.segments]]
    type       = "status"
    style      = "plain"
    foreground = "p:red"
    template   = "{{ if gt .Code 0 }} ✗ {{ .Code }}{{ end }}"

  [[blocks.segments]]
    type       = "text"
    style      = "plain"
    background = "transparent"
    foreground_templates = [
      "{{ if gt .Code 0 }}p:red{{ end }}",
      "p:green"
    ]
    template = " ❯"
