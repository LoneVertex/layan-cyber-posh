name: Validate Theme Configurations

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Oh My Posh
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -s https://ohmyposh.dev/install.sh | bash -s -- -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Oh My Posh installation
        run: oh-my-posh version

      - name: Validate TOML theme renders
        run: |
          echo "Validating TOML format…"
          oh-my-posh print primary --config themes/layan-cyber.omp.toml --plain

      - name: Validate JSON theme renders
        run: |
          echo "Validating JSON format…"
          oh-my-posh print primary --config themes/layan-cyber.omp.json --plain

      - name: Validate YAML theme renders
        run: |
          echo "Validating YAML format…"
          oh-my-posh print primary --config themes/layan-cyber.omp.yaml --plain

      - name: Validate JSON schema compliance
        run: |
          pip install jsonschema --quiet
          python3 - << 'EOF'
          import urllib.request, json, jsonschema, sys

          # Fetch official Oh My Posh JSON schema
          schema_url = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
          schema = json.loads(urllib.request.urlopen(schema_url).read())

          # Load exported theme JSON
          with open("themes/layan-cyber.omp.json") as f:
              theme = json.load(f)

          # oh-my-posh exposes runtime-only git options (fetch_status, fetch_upstream,
          # cache_duration, timeout) that are not listed in the published JSON schema
          # but are accepted and required by the runtime engine. We strip them before
          # schema validation so the gate tests structural correctness only.
          KNOWN_RUNTIME_PROPS = {"fetch_status", "fetch_upstream", "fetch_stash",
                                  "fetch_worktree", "cache_duration", "timeout"}
          for block in theme.get("blocks", []):
              for seg in block.get("segments", []):
                  opts = seg.get("options", {})
                  for key in KNOWN_RUNTIME_PROPS:
                      opts.pop(key, None)

          try:
              jsonschema.validate(instance=theme, schema=schema)
              print("✔  Schema validation passed — 100% compliant with Oh My Posh v3 schema.")
          except jsonschema.ValidationError as e:
              print(f"✗  Schema validation failed: {e.message}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Verify format synchronization
        run: |
          echo "Checking JSON export round-trip…"
          oh-my-posh config export --config themes/layan-cyber.omp.toml --format json --output /tmp/check.omp.json
          python3 -m json.tool /tmp/check.omp.json > /dev/null
          echo "✔  JSON is well-formed."

      - name: Narrow terminal overflow test
        run: |
          echo "Testing prompt at 60 columns (right-prompt must not wrap)…"
          OUTPUT=$(oh-my-posh print primary --config themes/layan-cyber.omp.toml --plain --terminal-width 60)
          LINES=$(echo "$OUTPUT" | wc -l)
          echo "Lines of output: $LINES"
          if [ "$LINES" -gt 2 ]; then
            echo "✗  Prompt broke into more than 2 lines at 60 cols!" >&2
            exit 1
          fi
          echo "✔  Narrow-terminal overflow OK."

      - name: Performance latency check
        run: |
          echo "Benchmarking prompt render time…"
          python3 - << 'EOF'
          import subprocess, re, sys

          result = subprocess.run(
              ["oh-my-posh", "debug", "--config", "themes/layan-cyber.omp.toml"],
              capture_output=True, text=True
          )
          # Strip ANSI escape codes, then extract run duration
          clean = re.sub(r"\x1b\[[0-9;]*m", "", result.stdout)
          match = re.search(r"Run duration:\s*([\d.]+)", clean)
          if match:
              ms = float(match.group(1))
              print(f"Prompt render time: {ms:.1f} ms")
              if ms > 50:
                  print(f"✗  Prompt render time {ms:.1f}ms exceeds 50ms budget!", file=sys.stderr)
                  sys.exit(1)
              print("✔  Latency within budget.")
          else:
              print("⚠  Could not parse execution time — skipping latency gate.")
          EOF
